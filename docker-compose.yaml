version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: umkm_db_mysql
    restart: always
    environment:
      MYSQL_DATABASE: umkm
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3305:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
name: CI Golang Backend

on:
  push:
    branches: [ "main", "feature/*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install dependency
        run: go mod tidy

      - name: Build backend
        run: go build ./...

      - name: Run test
        run: go test ./... || true